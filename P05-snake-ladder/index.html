<!DOCTYPE html>
<html>
<head>
  <title>Snake and Ladder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Snake and Ladder</h2>
  <div class="game">
    <div id="board"></div>
    <div class="panel">
      <p id="turn">Player 1's turn</p>
      <div id="dice">-</div>
      <button id="roll">Roll Dice</button>
      <p id="msg"></p>
      <button id="reset">New Game</button>
      <p class="legend">Red squares = snake (go down), green squares = ladder (go up). Red token = Player 1, blue token = Player 2.</p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
